; PlatformIO wrapper for the native ESP-IDF speech-recognition firmware.
; Board entry matches ESP32-S3-WROOM-1 N8R8 (8 MB flash + 8 MB octal PSRAM).
; Component manager still reads main/idf_component.yml (espressif/esp-sr).
; Flash with:  python -m platformio run -t upload --upload-port COM6
; Or:          run.bat flash   (auto-selects PIO when no official IDF)

[platformio]
; ESP-IDF layout uses main/ (not PlatformIO's default src/)
src_dir = main
default_envs = esp32s3_sr

[env:esp32s3_sr]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = espidf
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; Prefer CH343; override with --upload-port / PORT=
upload_port = COM6
monitor_port = COM6
; Pull in sdkconfig.defaults (ADC GPIO4, octal PSRAM, always-listen, mn7_en)
board_build.cmake_extra_args =
	-DSDKCONFIG_DEFAULTS=sdkconfig.defaults
; UTF-8 for movemodel.py + flash srmodels.bin after upload
extra_scripts = post:tools/pio_extra.py
